{{ $thumbnail := "" }}
{{ with .Params.thumbnail }}
  {{ $thumbnail = . }}
{{ end }}
<div class="bg-white shadow-md rounded-lg overflow-hidden max-w-2xl mx-auto">
  {{ if $thumbnail }}
    <img src="{{ $thumbnail }}" alt="{{ .Title }}" class="w-full h-48 object-cover" loading="lazy">
  {{ end }}
  <div class="p-4">
    <h2 class="text-lg font-semibold text-gray-900 mb-2">
      <a href="{{ .RelPermalink }}" class="hover:text-blue-600">{{ .Title }}</a>
    </h2>
    <p class="text-sm text-gray-600">{{ .Summary }}</p>
  </div>
</div>
