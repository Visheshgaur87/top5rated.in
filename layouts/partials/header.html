<header class="bg-white shadow-md">
  <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
    <a href="/" class="flex items-center space-x-2">
      <img src="/images/logo.png" alt="Top5Rated Logo" class="h-10 w-auto" />
      <span class="text-2xl font-bold text-gray-800">Top5Rated.in</span>
    </a>
    <nav class="hidden md:flex space-x-6">
      <a href="/" class="text-gray-700 hover:text-blue-600 font-medium">Home</a>
      <a href="/categories" class="text-gray-700 hover:text-blue-600 font-medium">Categories</a>
      <a href="/about" class="text-gray-700 hover:text-blue-600 font-medium">About</a>
      <a href="/contact" class="text-gray-700 hover:text-blue-600 font-medium">Contact</a>
    </nav>
    <button id="mobile-menu-toggle" class="md:hidden text-gray-700 focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
           viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>
  <div id="mobile-menu" class="md:hidden hidden px-4 pb-4 space-y-2">
    <a href="/" class="block text-gray-700 hover:text-blue-600 font-medium">Home</a>
    <a href="/categories" class="block text-gray-700 hover:text-blue-600 font-medium">Categories</a>
    <a href="/about" class="block text-gray-700 hover:text-blue-600 font-medium">About</a>
    <a href="/contact" class="block text-gray-700 hover:text-blue-600 font-medium">Contact</a>
  </div>
</header>
<script>
  document.getElementById('mobile-menu-toggle')?.addEventListener('click', function () {
    const menu = document.getElementById('mobile-menu');
    menu.classList.toggle('hidden');
  });
</script>
