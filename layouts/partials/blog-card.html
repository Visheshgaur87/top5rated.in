<div class="bg-white p-4 rounded-2xl shadow-md hover:shadow-xl transition duration-300">
  {{ with .Params.thumbnail }}
    <img src="{{ . | relURL }}" alt="{{ $.Title }}" class="w-full h-48 object-cover rounded-lg mb-3" />
  {{ end }}
  <h2 class="text-lg font-semibold text-gray-800 hover:text-blue-600 mb-1">
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </h2>
  <p class="text-sm text-gray-600">{{ .Summary | plainify | truncate 110 }}</p>
</div>
