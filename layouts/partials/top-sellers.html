<div class="space-y-4">
  <h3 class="text-xl font-bold text-gray-800">Top Sellers</h3>
  <ul class="space-y-4">
    {{ range .Site.Data.top_sellers }}
      <li class="bg-white rounded-lg p-3 shadow hover:shadow-md transition">
        <a href="{{ .link }}" target="_blank" rel="noopener noreferrer">
          <img src="{{ .image }}" alt="{{ .name }}" class="w-full rounded-md mb-2 object-cover h-32" loading="lazy" />
          <p class="text-sm text-gray-700">{{ .name }}</p>
        </a>
      </li>
    {{ end }}
  </ul>
</div>
